<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camu-Box Writer</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🎵 Camu-Box Writer</h1>
      <p class="subtitle">
        MIDIデータをNFCタグに書き込み、<a href="../player/">player</a
        >ページで再生できるようにします
      </p>
      <p class="terms-note">
        <a href="../terms.html" target="_blank" rel="noopener">利用規約</a
        >を確認のうえご利用ください。
      </p>

      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">MIDIファイルを選択</div>
        <div class="upload-hint">タップしてファイルを選択</div>
        <input type="file" id="midiInput" accept=".mid,.midi" />
      </div>

      <div class="file-info" id="fileInfo">
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>

      <div class="url-input-section" id="urlInputSection">
        <label for="playerUrl">プレイヤーURL:</label>
        <input
          type="text"
          id="playerUrl"
          placeholder="https://example.com/player/"
          value="https://manse-murhana.github.io/Camu-Box/player/"
        />
      </div>

      <div class="status" id="status"></div>

      <div class="output-section" id="outputSection">
        <div class="output-label">データサイズ情報</div>
        <div class="output-box" id="outputBox"></div>
        <div class="button-group">
          <button class="btn-nfc" id="nfcBtn">📱 NFCに書き込み</button>
        </div>
      </div>

      <div class="info-box">
        <strong>ℹ️ 使い方：</strong><br />
        1. 書き込むMIDIファイルを選択<br />
        2. 「NFCに書き込み」ボタンをタップ<br />
        3. NFCタグをデバイスに接触<br />
        ※ Android, Chrome version 89以降が必要です<br />
      </div>

      <div class="page-footer">
        <a class="top-link" href="../index.html">Top</a>
        /
        <a class="terms-link" href="../terms.html" target="_blank" rel="noopener"
          >利用規約</a
        >
        /
        <a
          class="github-link"
          href="https://github.com/Manse-Murhana/Camu-Box"
          target="_blank"
          rel="noopener"
          aria-label="GitHub repository"
        >
          <img
            src="https://img.shields.io/github/stars/Manse-Murhana/Camu-Box?style=social"
            alt="GitHub stars"
            loading="lazy"
            decoding="async"
          />
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <script src="scripts/writer.js"></script>
  </body>
</html>
