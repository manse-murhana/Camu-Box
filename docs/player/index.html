<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Camu-Box Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@magenta/music@^1.23.1"></script>
    <script src="scripts/themes.js"></script>
    <script src="scripts/instruments.js"></script>
    <script src="scripts/dataUtils.js"></script>
  </head>
  <body>
    <div class="player-container">
      <div class="player-header">
        <h1>🎵 Camu-Box Player</h1>
        <p class="subtitle">
          NFCタグを読み取り、書き込まれた音楽を再生します。
        </p>
      </div>

      <div class="controls" id="nfcControls">
        <button id="startNfcBtn" class="nfc-start-btn">タグを読み取る</button>
        <p class="nfc-warning">
          利用前に<a href="../terms.html" target="_blank" rel="noopener">規約</a
          >をご確認ください。
        </p>
      </div>

      <div class="track-info" id="trackInfo" style="display: none">
        <div class="track-title" id="trackTitle">Preparing...</div>
        <div class="track-details" id="trackDetails">--</div>
      </div>

      <div class="controls" id="playbackControls" style="display: none">
        <button id="playBtn" disabled>▶</button>
        <button id="stopBtn" disabled>⏹</button>
      </div>

      <details class="log-container">
        <summary id="logSummary">Initializing...</summary>
        <div id="log"></div>
      </details>

      <div class="page-footer">
        <a class="top-link" href="../index.html">Top</a>
        /
        <a class="terms-link" href="../terms.html" target="_blank" rel="noopener"
          >利用規約</a
        >
        /
        <a
          class="github-link"
          href="https://github.com/Manse-Murhana/Camu-Box"
          target="_blank"
          rel="noopener"
          aria-label="GitHub repository"
        >
          <img
            src="https://img.shields.io/github/stars/Manse-Murhana/Camu-Box?style=social"
            alt="GitHub stars"
            loading="lazy"
            decoding="async"
          />
        </a>
      </div>
    </div>

    <script src="scripts/player.js"></script>
    <script src="scripts/readNFC.js"></script>
  </body>
</html>
